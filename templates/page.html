<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%%PAGE_TITLE%% — %%SITE_TITLE%%</title>
<meta name="description" content="%%META_DESC%%">
<link rel="stylesheet" href="%%ROOT%%style.css">
</head>
<body>
<header class="site">
  <div class="wrap">
    <h1><a href="%%ROOT%%index.html">%%SITE_TITLE%%</a></h1>
    <p class="tag">%%TAGLINE%%</p>
    <nav class="main">
      <a href="%%ROOT%%index.html">Home</a>
      <a href="%%ROOT%%about.html">About</a>
      <a href="%%CHANNEL_URL%%">YouTube Channel</a>
    </nav>
  </div>
</header>
<main>
  <div class="wrap">
%%CONTENT%%
  </div>
</main>
<footer class="site">
  <div class="wrap">
    <p>%%SITE_TITLE%% is the companion blog for the <a href="%%CHANNEL_URL%%">%%CHANNEL_NAME%%</a> YouTube channel.
    New documentaries every day at 9:00 AM and 4:00 PM (America/Chicago). Facts only — every fact sourced and credited on each post.</p>
  </div>
</footer>
<script>
document.querySelectorAll('.facade').forEach(function(f){
  function go(){
    var d=document.createElement('div'); d.className='video';
    d.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+f.dataset.ytid+'?autoplay=1" title="Video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%;border:0"></iframe>';
    f.parentNode.replaceWith(d);
  }
  f.addEventListener('click',go);
  f.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
});
</script>
</body>
</html>
